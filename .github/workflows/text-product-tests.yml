name: Ubikia Text Product Tests
on:
  push:
    branches: [main]
    paths:
      - "src/text-product/**"
      - "cli/text-product.js"
      - "test/text-product.test.js"
      - ".github/workflows/text-product-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: node --test test/text-product.test.js
